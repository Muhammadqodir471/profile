<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shavkatbekov Muhammadqodir</title>
<style>
  :root{
    --bg:#060a12;
    --card:rgba(255,255,255,.04);
    --line:rgba(255,255,255,.09);
    --text:#e8eefc;
    --muted:#8d9ab5;
    --green:#22ffa3;
    --cyan:#2ad4ff;
    --violet:#8b6cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;
    overflow-x:hidden;
  }
  /* animated background */
  .bg{position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(600px 400px at 15% 10%,rgba(42,212,255,.18),transparent 60%),
      radial-gradient(700px 500px at 90% 20%,rgba(139,108,255,.18),transparent 60%),
      radial-gradient(600px 500px at 50% 100%,rgba(34,255,163,.12),transparent 60%);
  }
  .grid{position:fixed;inset:0;z-index:-1;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);
  }
  .wrap{max-width:860px;margin:0 auto;padding:56px 20px 40px}

  /* hero */
  .hero{text-align:center;padding:20px 0 36px}
  .shield{
    width:84px;height:84px;margin:0 auto 22px;
    display:grid;place-items:center;border-radius:24px;
    background:linear-gradient(135deg,rgba(34,255,163,.15),rgba(42,212,255,.15));
    border:1px solid rgba(34,255,163,.35);
    box-shadow:0 0 40px rgba(34,255,163,.25),inset 0 0 20px rgba(34,255,163,.1);
    animation:float 4s ease-in-out infinite;
  }
  .shield svg{width:44px;height:44px}
  @keyframes float{50%{transform:translateY(-8px)}}
  h1{
    font-size:clamp(30px,6.5vw,54px);
    line-height:1.1;font-weight:800;letter-spacing:-.02em;
    background:linear-gradient(90deg,#fff 0%,var(--cyan) 50%,var(--green) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .role{
    margin-top:16px;display:inline-flex;flex-wrap:wrap;gap:10px;justify-content:center;
  }
  .chip{
    padding:7px 15px;border-radius:999px;font-size:14px;font-weight:600;
    border:1px solid var(--line);background:var(--card);color:var(--text);
    backdrop-filter:blur(8px);
  }
  .chip b{color:var(--green)}
  .typing{
    margin-top:22px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:15px;color:var(--green);min-height:24px;
  }
  .typing::after{content:"▍";animation:blink 1s steps(2) infinite;margin-left:2px}
  @keyframes blink{50%{opacity:0}}

  /* contacts */
  .contacts{display:grid;gap:14px;margin:8px 0 44px}
  @media(min-width:640px){.contacts{grid-template-columns:1fr 1fr}}
  .btn{
    display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:20px;
    text-decoration:none;color:var(--text);position:relative;overflow:hidden;
    border:1px solid var(--line);background:var(--card);backdrop-filter:blur(10px);
    transition:transform .25s,border-color .25s,box-shadow .25s;
  }
  .btn:hover{transform:translateY(-4px)}
  .btn .ico{
    flex:none;width:50px;height:50px;border-radius:15px;display:grid;place-items:center;
  }
  .btn .ico svg{width:26px;height:26px}
  .btn small{display:block;color:var(--muted);font-size:13px}
  .btn strong{display:block;font-size:17px;letter-spacing:.01em}
  .btn .go{margin-left:auto;color:var(--muted);transition:transform .25s,color .25s}
  .btn:hover .go{transform:translateX(4px);color:#fff}

  .call:hover{border-color:rgba(34,255,163,.6);box-shadow:0 12px 40px rgba(34,255,163,.18)}
  .call .ico{background:linear-gradient(135deg,#17d98a,#22ffa3);color:#04281a}
  .tg:hover{border-color:rgba(42,212,255,.6);box-shadow:0 12px 40px rgba(42,212,255,.18)}
  .tg .ico{background:linear-gradient(135deg,#1e9bff,#2ad4ff);color:#04202b}

  /* sections */
  h2{
    font-size:13px;text-transform:uppercase;letter-spacing:.18em;color:var(--green);
    margin-bottom:8px;font-weight:700;
  }
  .title{font-size:clamp(24px,4vw,32px);font-weight:800;letter-spacing:-.01em;margin-bottom:12px}
  .lead{color:var(--muted);font-size:16px;max-width:680px;margin-bottom:26px}

  .cia{display:grid;gap:14px;margin-bottom:34px}
  @media(min-width:640px){.cia{grid-template-columns:repeat(3,1fr)}}
  .card{
    padding:22px;border-radius:20px;border:1px solid var(--line);background:var(--card);
    backdrop-filter:blur(10px);transition:transform .25s,border-color .25s;
  }
  .card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.2)}
  .card .em{font-size:28px;margin-bottom:8px}
  .card h3{font-size:17px;margin-bottom:4px}
  .card p{font-size:14px;color:var(--muted)}

  .areas{display:grid;gap:12px;margin-bottom:34px}
  @media(min-width:640px){.areas{grid-template-columns:1fr 1fr}}
  .area{
    display:flex;gap:14px;padding:16px 18px;border-radius:16px;
    border:1px solid var(--line);background:var(--card);
  }
  .area .em{font-size:22px;flex:none}
  .area h3{font-size:15px;margin-bottom:2px}
  .area p{font-size:13.5px;color:var(--muted)}

  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:40px}
  .tag{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;
    padding:6px 12px;border-radius:10px;color:var(--cyan);
    background:rgba(42,212,255,.08);border:1px solid rgba(42,212,255,.25);
  }

  .tips{
    padding:24px;border-radius:22px;margin-bottom:36px;
    border:1px solid rgba(34,255,163,.25);
    background:linear-gradient(135deg,rgba(34,255,163,.07),rgba(42,212,255,.05));
  }
  .tips h3{margin-bottom:12px;font-size:18px}
  .tips ul{list-style:none;display:grid;gap:10px}
  .tips li{display:flex;gap:10px;font-size:15px;color:#d3dcf0}
  .tips li::before{content:"✓";color:var(--green);font-weight:800}

  footer{text-align:center;color:var(--muted);font-size:13px;padding-top:10px;border-top:1px solid var(--line)}
  footer span{color:var(--green)}

  /* reveal */
  .rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s}
  .rv.in{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .rv{opacity:1;transform:none}
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid"></div>

<main class="wrap">

  <!-- HERO -->
  <section class="hero rv">
    <div class="shield">
      <svg viewBox="0 0 24 24" fill="none" stroke="#22ffa3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6l8-3z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
    </div>
    <h1>Shavkatbekov Muhammadqodir</h1>
    <div class="role">
      <span class="chip">🎓 <b>Студент</b> TUIT</span>
      <span class="chip">📍 <b>Tashkent</b></span>
      <span class="chip">🛡️ Кибербезопасность</span>
    </div>
    <div class="typing" id="typing"></div>
  </section>

  <!-- CONTACTS -->
  <section class="contacts rv">
    <a class="btn call" href="tel:+998939649964">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
      </span>
      <span>
        <small>Позвонить</small>
        <strong>+998 93 964 9964</strong>
      </span>
      <span class="go">→</span>
    </a>

    <a class="btn tg" href="https://t.me/shavkatbekovmuhammadqodir" target="_blank" rel="noopener">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.7 19.4c-.2 1-.8 1.3-1.7.8l-4.7-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.8 8.7-7.9c.4-.3-.1-.5-.6-.2L6.7 13.3 2.1 11.9c-1-.3-1-1 .2-1.5L20.2 3.5c.9-.3 1.6.2 1.7.8z"/></svg>
      </span>
      <span>
        <small>Telegram</small>
        <strong>t.me/shavkatbekovmuhammadqodir</strong>
      </span>
      <span class="go">→</span>
    </a>
  </section>

  <footer>
    © <span id="y"></span> Shavkatbekov Muhammadqodir · Студент TUIT · Tashkent
  </footer>
</main>

<script>
  document.getElementById('y').textContent = new Date().getFullYear();

  // typing effect
  const lines = ['> whoami: cybersecurity student','> status: learning & securing','> mindset: think like an attacker, defend like a pro'];
  const el = document.getElementById('typing');
  let li = 0, ci = 0, del = false;
  (function tick(){
    const s = lines[li];
    el.textContent = s.slice(0, ci);
    if(!del && ci < s.length){ ci++; setTimeout(tick, 55); }
    else if(!del){ del = true; setTimeout(tick, 1600); }
    else if(ci > 0){ ci--; setTimeout(tick, 22); }
    else { del = false; li = (li + 1) % lines.length; setTimeout(tick, 350); }
  })();

  // reveal on scroll
  const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }), {threshold:.12});
  document.querySelectorAll('.rv').forEach(n => io.observe(n));
</script>
</body>
</html>
